[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdocs-rag-workbench"
version = "0.1.0"
description = "A local RAG workbench for developer documentation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdullah Oztoprak" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.5.23",
  "fastapi>=0.115.6",
  "httpx>=0.27.2",
  "markdown-it-py>=3.0.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
  "typer>=0.15.1",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[project.scripts]
devdocs-rag = "devdocs_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
